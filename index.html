<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persuasive Agent Study</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: black; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <iframe
        id="streamIframe"
        src="https://share.streampixel.io/69263b754a9ae9b3797f3c6e" 
        allow="autoplay; fullscreen"
        width="100%"
        height="100%"
        frameborder="0"
        style="border: none;">
    </iframe>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const participantId = urlParams.get('participant_id') || 'NO_ID';

        const streamIframe = document.getElementById('streamIframe');
        streamIframe.addEventListener('click', () => {
            streamIframe.focus(); // Pass keyboard focus to the iframe on user interaction
        });
         console.log('Detected participant_id:', participantId);

        function sendParticipantId() {
            sendMessageToIframe({participant_id: participantId});
            streamIframe.contentWindow.postMessage({ message: { value: '720p (1280x720)', type: 'setResolution' } }, '*'); // Set resolution
            streamIframe.contentWindow.postMessage({ message: 'muteAudio' }, '*'); // Mute the stream
            streamIframe.contentWindow.postMessage({ message: 'unMuteAudio' }, '*'); // Unmute the stream
            streamIframe.contentWindow.postMessage({ message: 'terminateSession' }, '*'); // Terminate the session
            streamIframe.contentWindow.postMessage({ message: 'heartbeat' }, '*'); // Send a heartbeat
            streamIframe.contentWindow.postMessage({ customField: 'customValue' }, '*'); // Send custom data

            console.log('Sent wrapped message to Unreal:', participantId);
        }

        const sendMessageToIframe = (message) => {
            if (streamIframe && streamIframe.contentWindow) {
                streamIframe.contentWindow.postMessage(message, 'https://share.streampixel.io');
                console.log('Sent JSON message to Unreal:', message);

            }
        };

  

        window.addEventListener('message', (event) => {
            // Validate the message source for security
            if (event.origin === 'https://share.streampixel.io') {
                console.log('Message received:', event.data);

                // Example: Handle stream-state updates
                if (event.data.type === 'stream-state') {
                    console.log('Stream state:', event.data.value); // e.g., 'loadingComplete'
                }

                if (event.data.value === 'loadingComplete'){
                    console.log('Received loading complete');

                        
                        
                    sendParticipantId(); 
                }

                

                if (event.data.value === 'authenticating'){
                    console.log('Received authenticating');
                }

                

                if (event.data.value === 'finalising'){
                    console.log('Received finalising');
                }

            }
        });

    </script>
</body>
</html>
