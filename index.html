<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persuasive Agent Study</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: black; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <iframe id="streamPixelPlayer" 
            src="https://share.streampixel.io/69263b754a9ae9b3797f3c6e" 
            allow="autoplay; fullscreen; accelerometer; gyroscope; magnetometer">
    </iframe>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const participantId = urlParams.get('participant_id') || 'NO_ID';

        console.log('Detected participant_id:', participantId);

        function sendParticipantId() {
            const iframe = document.getElementById('streamPixelPlayer');
            if (iframe && iframe.contentWindow && participantId !== 'NO_ID') {
                // Wrapped in "message" key — this triggers the descriptor input event in Unreal
                iframe.contentWindow.postMessage({
                    message: {
                        participant_id: participantId   // Or { type: 'participant_id', value: participantId } if needed
                    }
                }, 'https://share.streampixel.io');

                console.log('Sent wrapped message to Unreal:', participantId);
            }
        }

        window.addEventListener('load', sendParticipantId);

        window.addEventListener('message', (event) => {
            if (event.origin !== 'https://share.streampixel.io') return;
            if (event.data?.type === 'stream-state' && event.data?.value === 'connected') {
                console.log('Stream connected - resending ID');
                sendParticipantId();
            }
        });
    </script>
</body>
</html>
